name: pulumi-lint

on:
  pull_request: 
    branches: [ "main" ]
    paths: [ "services/pulumi/**" ]
  push:
    branches: [ "main" ]
    paths: [ "services/pulumi/**" ]

jobs:
  format:
    name: oxfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-pulumi-project
      - name: Run oxfmt
        working-directory: services/pulumi/niployments
        run: pnpm run format

  lint:
    name: oxlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-pulumi-project
      - name: Run oxlint
        working-directory: services/pulumi/niployments
        run: pnpm run lint

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-pulumi-project
      - name: Type check and build the resource graph with Pulumi mocks
        working-directory: services/pulumi/niployments
        run: pnpm run test
