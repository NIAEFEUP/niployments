name: "Prepare Pulumi project"
description: "Generates the typed CRD SDK and installs dependencies"
inputs:
  node-version:
    description: "Node version"
    required: false
    default: "24"
  pulumi-version:
    description: "Pulumi CLI version"
    required: false
    default: "3.273.0"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: services/pulumi/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"
        cache-dependency-path: services/pulumi/pnpm-lock.yaml

    - uses: pulumi/setup-pulumi@v2
      with:
        pulumi-version: ${{ inputs.pulumi-version }}

    # @pulumi/crds is generated from services/pulumi/crd-manifests (a pnpm workspace package)
    - name: Generate the CRD SDK
      shell: sh
      working-directory: services/pulumi
      env:
        PULUMI_SKIP_UPDATE_CHECK: "true"
        # the Kubernetes provider plugin is downloaded from GitHub releases
        GITHUB_TOKEN: ${{ github.token }}
      run: ./generate-crds-sdk.sh

    - name: Install dependencies
      shell: sh
      working-directory: services/pulumi
      run: pnpm install --frozen-lockfile
