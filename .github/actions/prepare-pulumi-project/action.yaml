name: "Prepare Pulumi project"
description: "Installs dependencies and generates the typed CRD SDK with `pulumi install`"
inputs:
  node-version:
    description: "Node version"
    required: false
    default: "24"
  pulumi-version:
    description: "Pulumi CLI version"
    required: false
    default: "3.273.0"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: services/pulumi/niployments/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"
        cache-dependency-path: services/pulumi/niployments/pnpm-lock.yaml

    - uses: pulumi/setup-pulumi@v2
      with:
        pulumi-version: ${{ inputs.pulumi-version }}

    # Generates @pulumi/crds (sdks/crds) from the `packages:` entry in Pulumi.yaml, then runs
    # `pnpm install`.
    - name: Install dependencies
      shell: sh
      working-directory: services/pulumi/niployments
      env:
        PULUMI_SKIP_UPDATE_CHECK: "true"
        # the Kubernetes provider plugin is downloaded from GitHub releases
        GITHUB_TOKEN: ${{ github.token }}
      run: pulumi install
