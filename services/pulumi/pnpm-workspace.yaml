packages:
  - niployments
  # generated by generate-crds-sdk.sh, not committed
  - crds/nodejs

# One copy of each, shared by the program and the generated CRD SDK
overrides:
  "@pulumi/kubernetes": ^4.34.2
  "@pulumi/pulumi": ^3.273.0
  typescript: 6.0.3

# Install scripts are reviewed explicitly (pnpm refuses to install otherwise).
allowBuilds:
  # Pulumi downloads the provider plugins itself, so the SDK's install hook is not needed
  "@pulumi/kubernetes": false
  protobufjs: false
