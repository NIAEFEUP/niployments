minio:
  enabled: false
global:
    dnsService:  "rke2-coredns-rke2-coredns" 
loki:
  schemaConfig:
    configs:
      - from: "2024-11-01"
        object_store: s3
        store: tsdb
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    bucketNames:
      chunks: loki-chunks
      ruler: loki-chunks
      admin: loki-chunks
    type: s3
    s3:
      endpoint: garage.garage.svc.cluster.local:3900
      region: garage
      accessKeyId: "${GARAGE_ACCESS_KEY}"
      secretAccessKey: "${GARAGE_SECRET_KEY}"
      insecure: true
      s3ForcePathStyle: true
backend:
  persistence:
    enabled: true
    size: 3Gi
    storageClass: "longhorn-locality-no-backup"

write:
  persistence:
    enabled: true
    size: 3Gi
    storageClass: "longhorn-locality-no-backup"

read:
  persistence:
    enabled: true
    size: 3Gi
    storageClass: "longhorn-locality-no-backup"
