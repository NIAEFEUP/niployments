---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-beta-frontend-deployment
  namespace: tts-beta
  annotations:
    keel.sh/policy: "force"
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts-frontend
  template:
    metadata:
      labels:
        app: tts-frontend
    spec:
      containers:
        - name: tts-fe
          image: registry.niaefeup.pt/niaefeup/tts-fe:beta
          imagePullPolicy: Always
          resources:
            limits:
              memory: "512Mi"
              cpu: "1000m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: harbor-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: tts-beta-frontend-service
  namespace: tts-beta
spec:
  selector:
    app: tts-frontend
  ports:
    - port: 80
      targetPort: 80
  type: "ClusterIP"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-beta-backend-deployment
  namespace: tts-beta
  annotations:
    keel.sh/policy: "force"
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts-backend
  template:
    metadata:
      labels:
        app: tts-backend
    spec:
      containers:
        - name: tts-be
          image: registry.niaefeup.pt/niaefeup/tts-be:beta
          imagePullPolicy: Always
          resources:
            limits:
              memory: "512Mi"
              cpu: "1000m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: tts-be-secret
      imagePullSecrets:
        - name: harbor-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: tts-beta-backend-service
  namespace: tts-beta
spec:
  selector:
    app: tts-backend
  ports:
    - port: 80
      targetPort: 3000
  type: "ClusterIP"
