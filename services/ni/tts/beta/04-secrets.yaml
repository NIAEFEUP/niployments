---
apiVersion: v1
kind: Secret
metadata:
  name: tts-be-secret
  namespace: tts-beta
type: Opaque
stringData:
  # 1. Database (Prisma PostgreSQL connection URL)
  # Format: postgresql://<user>:<password>@cnpg-cluster-rw.pg.svc.cluster.local:5432/<database>
  DATABASE_URL: <FILL-IN>

  # 2. Frontend Origin (Used for CORS and redirect allowlist)
  FRONTEND_URL: <FILL-IN>

  # 3. Sigarra Keycloak SSO
  OIDC_CLIENT_ID: <FILL-IN>
  OIDC_CLIENT_SECRET: <FILL-IN>
  OIDC_REDIRECT_URI: <FILL-IN>
