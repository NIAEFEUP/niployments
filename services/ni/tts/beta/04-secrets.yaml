---
apiVersion: v1
kind: Secret
metadata:
  name: tts-be-secret
  namespace: tts-beta
type: Opaque
stringData:
  # Database (Prisma PostgreSQL connection URL)
  DATABASE_URL: <FILL-IN>

  # Frontend Origin (Used for CORS and redirect allowlist)
  FRONTEND_URL: <FILL-IN>

  # Sigarra Keycloak SSO
  OIDC_CLIENT_ID: <FILL-IN>
  OIDC_CLIENT_SECRET: <FILL-IN>
  OIDC_REDIRECT_URI: <FILL-IN>
