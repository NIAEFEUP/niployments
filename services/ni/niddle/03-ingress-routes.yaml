---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: niddle-staging
spec:
  stripPrefix:
    prefixes:
      - "/api"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: niddle-staging-https
  namespace: niddle-staging
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`niddle-staging.niaefeup.pt`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: niddle-staging-service
          port: 80
      middlewares:
      - name: strip-api-prefix
  tls:
    secretName: niddle-staging-cert
