kratos:
  config:
    dsn: memory
    serve:
      public:
        base_url: https://sso.niaefeup.pt/kratos/
        cors:
          enabled: true
      admin:
        base_url: http://127.0.0.1:4434/
    
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/identity.default.schema.json

    selfservice:
      default_browser_return_url: https://sso.niaefeup.pt/welcome
      allowed_return_urls:
        - https://sso.niaefeup.pt
        - http://localhost:19006/Callback
        - exp://localhost:8081/--/Callback

      methods:
        password:
          enabled: true
        totp:
          config:
            issuer: Kratos
          enabled: true
        lookup_secret:
          enabled: true
        link:
          enabled: true
        code:
          enabled: true
        oidc:
          enabled: true

      flows:
        error:
          ui_url: https://sso.niaefeup.pt/error
        settings:
          ui_url: https://sso.niaefeup.pt/settings
        recovery:
          ui_url: https://sso.niaefeup.pt/recovery
        verification:
          ui_url: https://sso.niaefeup.pt/verification
        logout:
          after:
            default_browser_return_url: https://sso.niaefeup.pt/login
        login:
          ui_url: https://sso.niaefeup.pt/login
          lifespan: 10m
        registration:
          lifespan: 10m
          ui_url: https://sso.niaefeup.pt/registration
          after:
            password:
              hooks:
                - hook: session
                - hook: show_verification_ui

    oauth2_provider:
      url: http://hydra-admin.sso.svc.cluster.local:4445
      headers:
        Authorization: Bearer some-token
      override_return_to: false

  development: true
  automigration:
    enabled: true
  identitySchemas:
    "identity.default.schema.json": |
      {
        "$id": "https://schemas.ory.sh/presets/kratos/identity.email.schema.json",
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Person",
        "type": "object",
        "properties": {
          "traits": {
            "type": "object",
            "properties": {
              "email": {
                "type": "string",
                "format": "email",
                "title": "E-Mail",
                "ory.sh/kratos": {
                  "credentials": {
                    "password": {
                      "identifier": true
                    }
                  },
                  "recovery": {
                    "via": "email"
                  },
                  "verification": {
                    "via": "email"
                  }
                }
              }
            },
            "required": [
              "email"
            ],
            "additionalProperties": false
          }
        }
      }
