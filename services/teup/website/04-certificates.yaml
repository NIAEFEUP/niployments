apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: teup-website-cert
  namespace: teup-website
spec:
  secretName: teup-website-cert
  issuerRef:
    name: letsencrypt-teup
    kind: ClusterIssuer
  commonName: teup.pt
  dnsNames:
    - teup.pt
    - www.teup.pt
    - teup.niaefeup.pt
